<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/index.css">
  <title>FinDash — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

  <div class="card">
    <div class="brand">
      <div class="brand-icon">F</div>
      <div class="brand-text">
        <strong>FinDash</strong>
        <span>controle financeiro</span>
      </div>
    </div>

    <h1>Bem-vindo de volta</h1>
    <p class="subtitle">Acesse sua conta para continuar</p>

    <form id="formLogin">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-primary">Entrar</button>
      <p id="mensagem"></p>
    </form>

    <div class="divider">ou</div>

    <p class="signup-link">
      Não tem uma conta? <a href="./pages/cadastro.html">Cadastre-se</a>
    </p>
  </div>

  <script>
    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      try {
        const resposta = await fetch("http://localhost:3000/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, senha }),
          credentials: "include"
        });

        const dados = await resposta.json();

        if (resposta.ok) {
          window.location.href = "pages/home.html";
        } else {
          document.getElementById("mensagem").textContent = dados.mensagem || "Erro ao fazer login.";
        }
      } catch (err) {
        document.getElementById("mensagem").textContent = "Erro de conexão com o servidor.";
      }
    });
  </script>

</body>
</html>
